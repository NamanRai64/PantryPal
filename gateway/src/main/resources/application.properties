# Server Port
server.port=8082

# Application Name
spring.application.name=api-gateway

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Routes

# Downstream Route: Auth Service
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Downstream Route: Inventory Service
spring.cloud.gateway.routes[1].id=inventory-service-route
spring.cloud.gateway.routes[1].uri=${INVENTORY_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventory/**

# Downstream Route: AI Service
spring.cloud.gateway.routes[2].id=ai-service-route
spring.cloud.gateway.routes[2].uri=${AI_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ai/**

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info