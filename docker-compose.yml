services:
  mysql:
    image: mysql:8.0
    container_name: pantrypal-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pantrypal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: pantrypal-auth-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: pantry_auth
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
    networks:
      - pantrypal-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pantrypal-gateway
    restart: on-failure
    depends_on:
      - auth-service
    ports:
      - "8082:8082"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
    networks:
      - pantrypal-network

networks:
  pantrypal-network:
    driver: bridge

volumes:
  mysql_data: